name: Vyrcord Android release
on:
  push:
    tags: ['android-installer-v*']
    branches: ['android-release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: Android version (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vyrcord-android-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'vyrcord/android'
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Check Android signing configuration
        env:
          ANDROID_MANIFEST_PRIVATE_KEY: ${{ secrets.ANDROID_MANIFEST_PRIVATE_KEY }}
          ANDROID_INSTALLER_KEYSTORE_BASE64: ${{ secrets.ANDROID_INSTALLER_KEYSTORE_BASE64 }}
          ANDROID_INSTALLER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_INSTALLER_KEYSTORE_PASSWORD }}
          ANDROID_INSTALLER_KEY_ALIAS: ${{ secrets.ANDROID_INSTALLER_KEY_ALIAS }}
          ANDROID_INSTALLER_KEY_PASSWORD: ${{ secrets.ANDROID_INSTALLER_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_MANIFEST_PRIVATE_KEY ANDROID_INSTALLER_KEYSTORE_BASE64 ANDROID_INSTALLER_KEYSTORE_PASSWORD ANDROID_INSTALLER_KEY_ALIAS ANDROID_INSTALLER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name in android-release"
              missing=1
            fi
          done
          exit "$missing"
      - name: Restore native source
        run: bash native-source/restore.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-37.0 build-tools;34.0.0 build-tools;37.0.0'
      - name: Validate release version
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED#android-installer-v}"
          version="${version#android-release/v}"
          [[ "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]
          echo "VYRCORD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and check the native bundle
        working-directory: bundle
        run: |
          bun install --frozen-lockfile
          bun run build --release-branch next --build-minify
          node scripts/hermes.mjs
          if grep -aqiE 'messageLoggerEnhanced|endcord\.message-logger|MessageLoggerIDB|endcord\.event-logs|endcord\.voice-channel-log|endcord\.keyword-notify|endcord\.anti-delete-message' dist/endcord.min.js; then
            echo "::error::A message logger is present in the bundle"
            exit 1
          fi
      - name: Build loader
        working-directory: android/loader
        run: |
          bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          # The patched Discord APK has its own persistent signing key. The embedded loader is covered by it,
          # and the downloaded module is independently covered by the release manifest.
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/vyrcord-loader-unsigned.apk"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the installer with its permanent APK signing key
        working-directory: android/installer
        env:
          INSTALLER_KEYSTORE: ${{ secrets.ANDROID_INSTALLER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_INSTALLER_KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.ANDROID_INSTALLER_KEY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.ANDROID_INSTALLER_KEY_PASSWORD }}
        run: |
          umask 077
          : "${INSTALLER_KEYSTORE:?Missing permanent installer keystore}"
          : "${KEYSTORE_PASSWORD:?Missing installer store password}"
          : "${KEYSTORE_ENTRY_ALIAS:?Missing installer key alias}"
          : "${KEYSTORE_ENTRY_PASSWORD:?Missing installer key password}"
          trap 'rm -f app/keystore.jks' EXIT
          printf '%s' "$INSTALLER_KEYSTORE" | base64 -d > app/keystore.jks
          sed -i -E "s/^version = .*/version = $VYRCORD_VERSION/" gradle.properties
          bash gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/Vyrcord-Installer.apk"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" verify "$RUNNER_TEMP/Vyrcord-Installer.apk"
          "$apksigner" sign --ks app/keystore.jks --ks-key-alias "$KEYSTORE_ENTRY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_ENTRY_PASSWORD \
            --out "$RUNNER_TEMP/endcord-xposed.apk" "$RUNNER_TEMP/vyrcord-loader-unsigned.apk"
          "$apksigner" verify "$RUNNER_TEMP/endcord-xposed.apk"
      - name: Sign bundle and publish the GitHub update channel
        env:
          ENDCORD_RELEASE_KEY: ${{ secrets.ANDROID_MANIFEST_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash android/release/publish.sh
